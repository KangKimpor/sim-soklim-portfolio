<?xml version="1.0" encoding="UTF-8"?>
<!-- The brand-mark from the top bar, as a standalone file: navy tile, paper
     monogram. The letters name the DM Mono stack, but an SVG favicon is loaded
     as an image, where no webfont is available: the viewer's own monospace draws
     them. Nothing external is requested either way, so the strict
     Content-Security-Policy in vercel.json serves it without an exception.
     Regenerate alongside the palette in css/style.css if the navy ever changes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Sim Soklim">
  <rect width="32" height="32" rx="0" ry="0" fill="#f2b705"/>
  <text x="16" y="16" fill="#14181d" font-family="DM Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" letter-spacing="0.5" text-anchor="middle" dominant-baseline="central">SS</text>
</svg>
